[package]
name = "serial-console"
description = "Serial ports (COM / tty) for console sessions. Independent of Tauri and React."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# Default feature `libudev` would need libudev at build time on Linux; port
# discovery still works without it (fewer USB details).
serialport = { version = "4.10.1", default-features = false }
serde.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.28", default-features = false, features = ["term", "fs"] }

[lints]
workspace = true
