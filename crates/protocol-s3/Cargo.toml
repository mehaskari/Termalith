[package]
name = "protocol-s3"
description = "S3 and S3-compatible object storage for the file browser (ADR-040)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
zeroize = "1.9"
object_store = { version = "0.14", default-features = false, features = ["aws"] }

[dev-dependencies]
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
s3s = "0.17"
s3s-fs = "0.17"
tempfile = "3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
