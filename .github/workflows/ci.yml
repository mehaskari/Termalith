name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            bin: target/debug/termalith-desktop
            require_sshd: "1"
          - name: Windows x64
            os: windows-latest
            bin: target/debug/termalith-desktop.exe
            # sshd-based tests are attempted but may skip on Windows.
            require_sshd: "0"
          - name: Linux x64
            os: ubuntu-latest
            bin: target/debug/termalith-desktop
            require_sshd: "1"
          # Extra architectures: not required for merging (branch protection
          # lists only the three above), so a slow runner never blocks a PR.
          - name: macOS x64
            os: macos-15-intel
            bin: target/debug/termalith-desktop
            require_sshd: "1"
          - name: Windows arm64
            os: windows-11-arm
            bin: target/debug/termalith-desktop.exe
            require_sshd: "0"
          - name: Linux arm64
            os: ubuntu-24.04-arm
            bin: target/debug/termalith-desktop
            require_sshd: "1"

    steps:
      # Third-party actions are pinned to full commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner info
        shell: bash
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          uname -a || true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev build-essential \
            xvfb openssh-server gnome-keyring dbus

      # A real root-run sshd and a throwaway account so password
      # authentication can be tested (an unprivileged sshd cannot verify
      # passwords). Localhost only, random password, ephemeral runner.
      - name: Set up system sshd for password-auth test (Linux)
        if: runner.os == 'Linux'
        run: |
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          sudo useradd -m -s /bin/bash termalith-test
          echo "termalith-test:$PW" | sudo chpasswd
          printf 'Match User termalith-test Address 127.0.0.1\n  PasswordAuthentication yes\n' \
            | sudo tee /etc/ssh/sshd_config.d/00-termalith-test.conf >/dev/null
          # Not created yet on images where ssh is socket-activated (arm64).
          sudo mkdir -p /run/sshd
          sudo sshd -t
          sudo systemctl restart ssh || sudo service ssh restart
          {
            echo "TERMALITH_TEST_SSH_HOST=127.0.0.1"
            echo "TERMALITH_TEST_SSH_PORT=22"
            echo "TERMALITH_TEST_SSH_USER=termalith-test"
            echo "TERMALITH_TEST_SSH_PASSWORD=$PW"
          } >> "$GITHUB_ENV"

      # The Windows ARM image ships without Rust.
      - name: Install rustup (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # PRs only restore the cache; saving it (~2 min on Windows) happens
      # on main, whose cache every PR can read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        shell: bash
        env:
          TERMALITH_REQUIRE_SSHD: ${{ matrix.require_sshd }}
          TERMALITH_REQUIRE_NATIVE_SECRETS: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Secret Service needs a D-Bus session and an unlocked keyring.
            dbus-run-session -- bash -c '
              printf "ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              cargo test --workspace -- --nocapture'
          else
            cargo test --workspace -- --nocapture
          fi

      - name: TypeScript typecheck
        run: corepack pnpm typecheck

      - name: Frontend tests
        run: corepack pnpm test

      # Build and smoke-test even if earlier checks failed, for more signal per run.
      - name: Build desktop app (debug, embedded frontend)
        if: ${{ !cancelled() }}
        run: corepack pnpm --filter @termalith/desktop tauri build --debug --no-bundle

      - name: Smoke test (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: bash scripts/smoke-test.sh ${{ matrix.bin }}

      - name: Smoke test (Linux, Xvfb)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a bash scripts/smoke-test.sh ${{ matrix.bin }}

      - name: Smoke test (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Bin ${{ matrix.bin }}
