name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            bin: target/debug/termalith-desktop
            require_sshd: "1"
          - name: Windows x64
            os: windows-latest
            bin: target/debug/termalith-desktop.exe
            # sshd-based tests are attempted but may skip on Windows.
            require_sshd: "0"
          - name: Linux x64
            os: ubuntu-latest
            bin: target/debug/termalith-desktop
            require_sshd: "1"
          # Extra architectures: not required for merging (branch protection
          # lists only the three above), so a slow runner never blocks a PR.
          - name: macOS x64
            os: macos-15-intel
            bin: target/debug/termalith-desktop
            require_sshd: "1"
          - name: Windows arm64
            os: windows-11-arm
            bin: target/debug/termalith-desktop.exe
            require_sshd: "0"
          - name: Linux arm64
            os: ubuntu-24.04-arm
            bin: target/debug/termalith-desktop
            require_sshd: "1"

    steps:
      # Third-party actions are pinned to full commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Runner info
        shell: bash
        run: |
          echo "image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          uname -a || true

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev build-essential \
            xvfb openssh-server gnome-keyring dbus freerdp3-x11

      # A real root-run sshd and a throwaway account so password
      # authentication can be tested (an unprivileged sshd cannot verify
      # passwords). Localhost only, random password, ephemeral runner.
      - name: Set up system sshd for password-auth test (Linux)
        if: runner.os == 'Linux'
        run: |
          PW="$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          sudo useradd -m -s /bin/bash termalith-test
          echo "termalith-test:$PW" | sudo chpasswd
          printf 'Match User termalith-test Address 127.0.0.1\n  PasswordAuthentication yes\n' \
            | sudo tee /etc/ssh/sshd_config.d/00-termalith-test.conf >/dev/null
          # Not created yet on images where ssh is socket-activated (arm64).
          sudo mkdir -p /run/sshd
          sudo sshd -t
          sudo systemctl restart ssh || sudo service ssh restart
          {
            echo "TERMALITH_TEST_SSH_HOST=127.0.0.1"
            echo "TERMALITH_TEST_SSH_PORT=22"
            echo "TERMALITH_TEST_SSH_USER=termalith-test"
            echo "TERMALITH_TEST_SSH_PASSWORD=$PW"
          } >> "$GITHUB_ENV"

      # The Windows ARM image ships without Rust.
      - name: Install rustup (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Install Rust toolchain (from rust-toolchain.toml)
        shell: bash
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      # PRs only restore the cache; saving it (~2 min on Windows) happens
      # on main, whose cache every PR can read.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile

      # Known vulnerabilities in shipped frontend packages (Rust crates are
      # checked by cargo-deny). Once per run is enough.
      - name: Frontend dependency audit
        if: matrix.name == 'Linux x64'
        run: corepack pnpm audit --prod

      - name: Rust format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust tests
        shell: bash
        env:
          TERMALITH_REQUIRE_SSHD: ${{ matrix.require_sshd }}
          TERMALITH_REQUIRE_NATIVE_SECRETS: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Secret Service needs a D-Bus session and an unlocked keyring.
            dbus-run-session -- bash -c '
              printf "ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
              cargo test --workspace -- --nocapture'
          else
            cargo test --workspace -- --nocapture
          fi

      # Real clients and servers: FreeRDP against the test endpoint and a
      # real xrdp (certificate read, pinned, wrong pin refused; ADR-027),
      # and TigerVNC's viewer against Xvnc with the launch plan Termalith
      # uses. Localhost only, ephemeral runner.
      - name: FTP against a real server
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/ftp"
          "$RUNNER_TEMP/ftp/bin/pip" install -q pyftpdlib==2.2.0 pyopenssl
          root="$(mktemp -d)"
          export TERMALITH_TEST_FTP_PASSWORD="$(openssl rand -hex 16)"
          "$RUNNER_TEMP/ftp/bin/python" scripts/ftp-test-server.py "$root" 2121 &
          cert="$RUNNER_TEMP/ftps.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout "$cert" -out "$cert.crt"
          cat "$cert.crt" >> "$cert"
          root2="$(mktemp -d)"
          "$RUNNER_TEMP/ftp/bin/python" scripts/ftp-test-server.py "$root2" 2990 "$cert" &
          for p in 2121 2990; do for _ in $(seq 30); do nc -z 127.0.0.1 $p && break; sleep 1; done; done
          export TERMALITH_TEST_FTP=127.0.0.1:2121 TERMALITH_TEST_FTPS=127.0.0.1:2990
          export TERMALITH_TEST_FTPS_SHA256="$(openssl x509 -in "$cert.crt" -outform DER | openssl dgst -sha256 -r | cut -d' ' -f1)"
          cargo test -p protocol-ftp --test real_server -- --nocapture
          cargo test -p app-core --test ftp_login -- --nocapture

      - name: Mosh against the test sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -q mosh
          TERMALITH_TEST_MOSH=1 TERMALITH_REQUIRE_SSHD=1 cargo test -p app-core --test mosh_real -- --nocapture

      - name: Remote desktop against real servers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends \
            xrdp tigervnc-standalone-server tigervnc-viewer netcat-openbsd
          # Require TLS (older xrdp falls back to legacy RDP security when
          # it cannot use its certificate, which Termalith refuses).
          sudo adduser xrdp ssl-cert || true
          sudo sed -i 's/^security_layer=.*/security_layer=tls/' /etc/xrdp/xrdp.ini
          dpkg-query -W xrdp
          sudo systemctl restart xrdp || sudo service xrdp restart
          for _ in $(seq 30); do nc -z 127.0.0.1 3389 && break; sleep 1; done
          Xvnc :5 -rfbport 5905 -localhost -SecurityTypes None -geometry 800x600 \
            > "$RUNNER_TEMP/xvnc.log" 2>&1 &
          for _ in $(seq 30); do nc -z 127.0.0.1 5905 && break; sleep 1; done
          # A second Xvnc with VNC authentication and a password made per run.
          if command -v vncpasswd >/dev/null; then
            export TERMALITH_TEST_VNC_PASSWORD="$(openssl rand -hex 4)"
            printf '%s\n' "$TERMALITH_TEST_VNC_PASSWORD" | vncpasswd -f > "$RUNNER_TEMP/vncpasswd"
            Xvnc :6 -rfbport 5906 -localhost -SecurityTypes VncAuth -PasswordFile "$RUNNER_TEMP/vncpasswd" \
              -geometry 640x480 > "$RUNNER_TEMP/xvnc-auth.log" 2>&1 &
            for _ in $(seq 30); do nc -z 127.0.0.1 5906 && break; sleep 1; done
            export TERMALITH_TEST_VNC_AUTH=127.0.0.1:5906
          fi
          export TERMALITH_FREERDP="$(command -v xfreerdp3)"
          export TERMALITH_TEST_XRDP=127.0.0.1:3389
          export TERMALITH_RDP_DEBUG=1
          export TERMALITH_TEST_XRDP_SHA256="$(sudo openssl x509 -in /etc/xrdp/cert.pem -outform DER | sha256sum | cut -d' ' -f1)"
          export TERMALITH_TEST_VNC=127.0.0.1:5905
          export TERMALITH_TEST_VNC_LOG="$RUNNER_TEMP/xvnc.log"
          export TERMALITH_VNCVIEWER="$(command -v vncviewer)"
          xfreerdp3 --version | head -1
          xvfb-run -a cargo test -p remote-desktop --lib freerdp_accepts -- --nocapture
          xvfb-run -a cargo test -p remote-desktop --features embedded --test real_servers -- --nocapture || {
            sudo tail -n 40 /var/log/xrdp.log || true
            exit 1
          }

      - name: TypeScript typecheck
        run: corepack pnpm typecheck

      - name: Frontend tests
        run: corepack pnpm test

      # Build and smoke-test even if earlier checks failed, for more signal per run.
      - name: Build desktop app (debug, embedded frontend)
        if: ${{ !cancelled() }}
        run: corepack pnpm --filter @termalith/desktop tauri build --debug --no-bundle

      - name: Smoke test (macOS)
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: bash scripts/smoke-test.sh ${{ matrix.bin }}

      - name: Smoke test (Linux, Xvfb)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a bash scripts/smoke-test.sh ${{ matrix.bin }}

      # A copy next to a TermalithData folder must keep its data there.
      - name: Portable mode (macOS, Linux)
        if: ${{ !cancelled() && runner.os != 'Windows' }}
        shell: bash
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          dir="$(mktemp -d)"
          cp "${{ matrix.bin }}" "$dir/"
          mkdir "$dir/TermalithData"
          bin="$dir/$(basename "${{ matrix.bin }}")"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a bash scripts/smoke-test.sh "$bin"; else bash scripts/smoke-test.sh "$bin"; fi
          ls -la "$dir/TermalithData"
          test -f "$dir/TermalithData/termalith.db"
          echo "PASS: portable data stayed in TermalithData"

      # Embedded RDP against the runner's own Remote Desktop service (NLA,
      # a real Windows certificate). Informational until it has proven
      # stable on hosted runners, so it cannot block merges.
      - name: Embedded RDP against Windows Remote Desktop (Windows x64)
        if: ${{ !cancelled() && matrix.name == 'Windows x64' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $pw = "Tl!" + [guid]::NewGuid().ToString("N").Substring(0, 20) + "a1"
          Write-Host "::add-mask::$pw"
          # New-LocalUser: `net user` asks a Y/N question for passwords over
          # 14 characters and creates nothing without an answer.
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name termalith-rdp -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member termalith-rdp
          Add-LocalGroupMember -Group "Users" -Member termalith-rdp -ErrorAction SilentlyContinue
          Get-LocalUser termalith-rdp | Format-Table Name, Enabled | Out-String | Write-Host
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Start-Service TermService -ErrorAction SilentlyContinue
          for ($i = 0; $i -lt 30; $i++) {
            if ((Test-NetConnection 127.0.0.1 -Port 3389 -WarningAction SilentlyContinue).TcpTestSucceeded) { break }
            Start-Sleep -Seconds 1
          }
          $env:TERMALITH_TEST_WINRDP = "127.0.0.1:3389"
          $env:TERMALITH_TEST_WINRDP_USER = "termalith-rdp"
          $env:TERMALITH_TEST_WINRDP_PASSWORD = $pw
          $env:TERMALITH_TEST_WINRDP_DOMAIN = $env:COMPUTERNAME
          $env:TERMALITH_RDP_DEBUG = "1"
          cargo test -p remote-desktop --features embedded --test windows_rdp -- --nocapture

      - name: Smoke test (Windows)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Bin ${{ matrix.bin }}
