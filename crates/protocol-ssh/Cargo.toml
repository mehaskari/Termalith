[package]
name = "protocol-ssh"
description = "SSH/SFTP client adapter (russh). Independent of Tauri and React."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
russh = "0.65.0"
russh-sftp = "3.0.1"
thiserror.workspace = true
tokio = { version = "1.54", features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[dev-dependencies]
test-sshd = { path = "../test-sshd" }
# Same version and feature russh 0.65 uses; only for generating test keys.
rand = { version = "0.10", features = ["thread_rng"] }
sha2 = "0.11"
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "process"] }

[lints]
workspace = true
