[package]
name = "app-core"
description = "Application services: saved sessions, terminals (local + SSH), host-key prompts. Independent of Tauri and React."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
credential-store = { path = "../credential-store" }
getrandom = "0.3"
protocol-ssh = { path = "../protocol-ssh" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
terminal-pty = { path = "../terminal-pty" }
thiserror.workspace = true
tokio = { version = "1.54", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
zeroize = "1.9"

[dev-dependencies]
zeroize = "1.9"
credential-store = { path = "../credential-store" }
test-sshd = { path = "../test-sshd" }
serde_json.workspace = true
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
