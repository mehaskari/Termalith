# cargo-deny policy (SECURITY.md: track advisories and licenses).
# Run: cargo deny check

[graph]
all-features = true

[advisories]
# Any RustSec advisory affecting the dependency graph fails the check.
# Exceptions must be listed here with a reason and an expiry plan.
yanked = "deny"
ignore = [
    # Marvin Attack: non-constant-time RSA private-key operations in the
    # `rsa` crate (no patched release exists). Pulled in by russh's `rsa`
    # feature. Only reached when the user authenticates with an RSA private
    # key loaded by Termalith; RSA host-key verification uses public-key
    # operations only. Owner decision pending (ADR-017); revisit when
    # RustCrypto/RSA ships constant-time padding/blinding.
    { id = "RUSTSEC-2023-0071", reason = "RSA user-key signing only; see ADR-017" },
    # Unmaintained (not a vulnerability): build-time proc macro used by the
    # gtk-rs 0.18 stack under Tauri on Linux. No safe upgrade available.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via gtk-rs/Tauri" },
    # zvariant, zvariant_derive, zbus_names were merged into zbus 6 and are
    # flagged "unmaintained" (not vulnerabilities). Linux-only, pulled in by
    # secret-service (Secret Service backend of credential-store), which is
    # still on zbus 5. Drop these once it moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "merged into zbus 6; via secret-service" },
    { id = "RUSTSEC-2026-0371", reason = "merged into zbus 6; via secret-service" },
    { id = "RUSTSEC-2026-0372", reason = "merged into zbus 6; via secret-service" },
]

[licenses]
# Permissive licenses compatible with the project's MIT license (ADR-010).
# Copyleft licenses require review before being added here.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # File-level weak copyleft. Used unmodified by Tauri (cssparser,
    # selectors, dtoa-short via tauri-utils/wry; option-ext via dirs).
    # Compatible with distributing an MIT application; see ADR-017.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
