[package]
name = "termalith-desktop"
description = "Termalith desktop shell (Tauri boundary only; no domain logic here)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
name = "termalith_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
app-core = { path = "../../../crates/app-core" }
remote-desktop = { path = "../../../crates/remote-desktop" }
credential-store = { path = "../../../crates/credential-store" }
protocol-ssh = { path = "../../../crates/protocol-ssh" }
serial-console = { path = "../../../crates/serial-console" }
network-tools = { path = "../../../crates/network-tools" }
local-servers = { path = "../../../crates/local-servers" }
tokio-util = { version = "0.7.20", default-features = false }
terminal-pty = { path = "../../../crates/terminal-pty" }
zeroize = "1.9"
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rfd = { version = "0.15", default-features = false, features = ["gtk3", "common-controls-v6"] }
tokio = { version = "1.54.1", default-features = false, features = ["sync"] }

[lints]
workspace = true
