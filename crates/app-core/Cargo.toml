[package]
name = "app-core"
description = "Application services: saved sessions, terminals (local + SSH), host-key prompts. Independent of Tauri and React."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
credential-store = { path = "../credential-store" }
getrandom = "0.3"
protocol-ssh = { path = "../protocol-ssh" }
protocol-telnet = { path = "../protocol-telnet" }
remote-desktop = { path = "../remote-desktop", features = ["embedded"] }
serial-console = { path = "../serial-console" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
terminal-pty = { path = "../terminal-pty" }
thiserror.workspace = true
tokio = { version = "1.54", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
zeroize = "1.9"
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[dev-dependencies]
zeroize = "1.9"
credential-store = { path = "../credential-store" }
test-sshd = { path = "../test-sshd" }
serde_json.workspace = true
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
nix = { version = "0.28", default-features = false, features = ["term", "fs"] }
serial-console = { path = "../serial-console" }

[lints]
workspace = true
