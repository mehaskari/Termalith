[package]
name = "protocol-ftp"
description = "FTP client for the file browser: listing, transfers without partial files, cancellation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# no-log: suppaftp's debug log would otherwise include commands.
suppaftp = { version = "12.2.1", default-features = false, features = ["tokio-rustls-aws-lc-rs", "no-log"] }
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { version = "0.7.20", default-features = false }
zeroize = "1.9"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
