[package]
name = "remote-desktop"
description = "RDP and VNC through external client programs (hybrid strategy, external mode). Independent of Tauri and React."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
ironrdp-blocking = { version = "0.12.0", optional = true }
ironrdp-cliprdr = { version = "0.9.0", optional = true }
ironrdp-connector = { version = "0.12", optional = true }
ironrdp-displaycontrol = { version = "0.10", optional = true }
ironrdp-dvc = { version = "0.10", optional = true }
ironrdp-egfx = { version = "0.5.0", optional = true, default-features = false }
vnc-rs = { version = "0.6.0", optional = true }
ironrdp-graphics = { version = "0.11.0", optional = true }
ironrdp-input = { version = "0.9.0", optional = true }
ironrdp-pdu = { version = "0.11.0", optional = true }
ironrdp-session = { version = "0.13.0", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
serde.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1.54", features = ["io-util", "process", "rt", "time"] }
zeroize = "1.9"

[features]
# Experimental embedded RDP viewer (ADR-030); off by default.
embedded = ["dep:ironrdp-connector", "dep:ironrdp-graphics", "dep:ironrdp-pdu", "dep:ironrdp-session", "dep:ironrdp-blocking", "dep:ironrdp-input", "dep:ironrdp-dvc", "dep:ironrdp-displaycontrol", "dep:ironrdp-cliprdr", "dep:ironrdp-egfx", "dep:vnc-rs", "tokio/net", "tokio/macros"]

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3.27"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
