[workspace]
resolver = "3"
members = ["crates/terminal-pty", "crates/protocol-ssh", "crates/credential-store", "crates/app-core", "crates/test-sshd", "crates/serial-console", "crates/network-tools", "crates/remote-desktop", "crates/protocol-telnet", "crates/protocol-ftp", "crates/local-servers", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.7"
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.dependencies]
portable-pty = "0.9.0"
thiserror = "2.0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
tauri-build = { version = "2", features = [] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
