[package]
name = "terminal-pty"
description = "Local PTY sessions with bounded, flow-controlled output. Independent of Tauri and React."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
portable-pty.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Same major as portable-pty 0.9 uses, so only one copy is built. Needed for
# SIGKILL escalation; portable-pty's own kill() only sends SIGHUP on Unix.
nix = { version = "0.28", default-features = false, features = ["signal"] }

[lints]
workspace = true
