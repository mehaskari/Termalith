# Project website and documentation: https://mehaskari.github.io/Termalith/
# Built by .github/workflows/pages.yml on every push to main that touches it.
# Local preview:  pip install -r website/requirements.txt && mkdocs serve -f website/mkdocs.yml
site_name: Termalith
site_description: Free, open-source remote administration app for macOS, Windows and Linux — SSH and Mosh terminals, SFTP/FTP/FTPS, RDP and VNC, tunnels, serial and Telnet consoles and network tools in one window
site_url: https://mehaskari.github.io/Termalith/
repo_url: https://github.com/mehaskari/Termalith
repo_name: mehaskari/Termalith
edit_uri: edit/main/website/docs/
docs_dir: docs
site_dir: ../site
strict: true

nav:
  - Home: index.md
  - User Guide:
      - guide/index.md
      - Download and install: guide/install.md
      - Your first connection: guide/first-steps.md
      - Sessions: guide/sessions.md
      - SSH: guide/ssh.md
      - Terminals: guide/terminals.md
      - Files: guide/files.md
      - Remote desktop: guide/remote-desktop.md
      - Serial, Telnet and tools: guide/serial-telnet-tools.md
      - Passwords and your data: guide/passwords-and-data.md
      - Settings: guide/settings.md
      - Keyboard shortcuts: guide/shortcuts.md
      - Coming from MobaXterm: guide/mobaxterm.md
      - Troubleshooting: guide/troubleshooting.md
  - Security: security.md
  - Changelog: changelog.md
  - Building and releasing: releasing.md
  - Third-party licenses: third-party.md

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  custom_dir: overrides  # home.html: the landing page at the site root
  features:
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
    - navigation.sections
    - navigation.indexes
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true

validation:
  links:
    anchors: warn
